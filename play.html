.coding-lab{padding:28px 0 42px;max-width:1040px;margin:auto}.lab-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.coding-lab>h1{font-family:'Space Grotesk',sans-serif;font-size:40px;letter-spacing:-.04em;font-weight:500;margin:8px 0 24px}.lab-selection{display:flex;align-items:center;gap:18px;max-width:560px;margin-bottom:28px}.lab-selection label{white-space:nowrap;font-size:13px;color:var(--muted)}.lab-selection select{flex:1;min-width:0}.coding-lab>h2{font-size:23px;font-weight:500;margin:0 0 10px}.lab-prompt{color:var(--muted);font-size:16px;line-height:1.7;max-width:780px;margin:0 0 24px}.lab-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:20px}.lab-editor-panel,.lab-output-panel{min-width:0;padding:22px;border:1px solid var(--border);background:var(--surface);border-radius:8px}.lab-editor-panel>label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}#code-editor{display:block;width:100%;height:285px;padding:16px;border:1px solid #37504d;border-radius:5px;resize:vertical;font:15px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--text);background:#0b1213;tab-size:4;white-space:pre;overflow:auto}#code-editor:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.lab-buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:18px}.lab-buttons .primary-button{padding:12px 19px}.lab-buttons button:disabled{opacity:.45;cursor:default}.lab-output-panel pre,.lab-help pre{padding:15px;background:#0b1213;border:1px solid var(--border);border-radius:5px;white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.6 ui-monospace,Consolas,monospace;margin:12px 0 22px}.lab-output-panel #code-output{min-height:130px;margin-bottom:12px}.run-status{font-size:13px;line-height:1.6;color:var(--muted);min-height:24px;margin-bottom:0}.run-status.passed{color:var(--accent)}.lab-help{padding:18px 20px;border:1px solid var(--border);border-radius:6px;margin-top:22px;font-size:14px;color:var(--muted);line-height:1.7}.lab-help summary{cursor:pointer;color:var(--text)}.lab-foot{font-size:12px;color:var(--muted);line-height:1.7;margin-top:22px}.msx-display-panel{padding:22px;background:#0b1213;border:1px solid var(--border);border-radius:8px;margin-top:20px}#msx-mount{max-width:100%;overflow:hidden;margin-top:16px}#wmsx-screen{max-width:100%;margin:auto!important}#wmsx-screen canvas{max-width:100%;height:auto}.msx-display-panel[hidden]{display:none}

<script type="module">
const xq = (id, category, level, topic, prompt, options, explanation, extra = {}) => ({ id, category, level, topic, prompt, options, explanation, ...extra });
const py = (id, level, topic, prompt, code, options, explanation, expected) => xq(`py-${id}`, 'python', level, topic, prompt, options, explanation, { code, source: 'python', ...(expected === undefined ? {} : { sampleOutput: expected }) });
const basic = (id, level, topic, prompt, code, options, explanation) => xq(`msx-${id}`, 'msx', level, topic, prompt, options, explanation, { code, source: 'msx' });

const EXTRA_QUESTIONS = [
  xq('logic-and', 'logic', 1, 'Interlocks', 'A low-voltage controller may run only when ENABLE is 1 AND READY is 1. ENABLE = 1 and READY = 0. What should RUN be?', ['0', '1', 'Always alternate', 'Depends on which input arrived first'], 'An AND gate produces 1 only when every input is 1. This is a logic exercise; actual safety interlocks require a suitable safety design.'),
  xq('logic-or', 'logic', 1, 'Alarm logic', 'A panel lights an indicator if either of two sensors is active. Which Boolean function describes this?', ['OR', 'AND', 'NOT', 'XNOR'], 'OR is true when at least one input is true, including when both are true.'),
  xq('logic-xor', 'logic', 1, 'Switch states', 'An indicator should light when exactly one of two switches is on. Which gate matches this?', ['XOR', 'OR', 'AND', 'NOR'], 'XOR is true for different input states (01 or 10), and false for 00 and 11.'),
  xq('logic-active-low', 'logic', 1, 'Signal polarity', 'A chip’s /RESET input is active LOW. Which voltage state asserts reset within its valid logic range?', ['Logic 0', 'Logic 1', 'Either state equally', 'Only an alternating signal'], 'An active-low control is asserted by logic 0. The slash, bar or suffix often identifies that polarity.'),
  xq('logic-nand', 'logic', 1, 'Truth tables', 'A NAND gate has inputs A = 1 and B = 1. What is its output?', ['0', '1', '2', 'Floating'], 'NAND is NOT(AND). AND is 1 for 11, so NAND is 0.'),
  xq('logic-invert', 'logic', 1, 'Gate building', 'You connect both inputs of a NAND gate to the same signal A. What function results?', ['NOT A', 'A', 'Always 0', 'Always 1'], 'A AND A = A. Negating that gives NOT A, so a NAND with tied inputs acts as an inverter.'),
  xq('logic-demorgan', 'logic', 2, 'Alarm design', 'An alarm condition is NOT(A AND B). Which equivalent form can you use?', ['(NOT A) OR (NOT B)', '(NOT A) AND (NOT B)', 'A OR B', 'A XOR B'], 'De Morgan’s law replaces a negated AND with an OR of the negated inputs.'),
  xq('logic-dff', 'logic', 2, 'State storage', 'A positive-edge-triggered D flip-flop has D = 1 just before a valid rising clock edge, meeting setup and hold times. What does Q become?', ['1', '0 regardless of D', 'The clock frequency', 'A copy of D at every instant'], 'A D flip-flop samples D at the specified clock edge and stores that state between edges.'),
  xq('logic-debounce', 'logic', 2, 'Find the fault', 'One button press advances a digital counter several times. The switch directly feeds the clock input. What is the likely cause?', ['Contact bounce creates several transitions', 'The counter needs AC mains', 'The button stores several binary digits', 'An AND gate always multiplies pulses'], 'Mechanical contacts often bounce. Use an appropriate debouncing method before treating the press as one digital event.'),
  xq('logic-mux', 'logic', 2, 'Signal selection', 'You need to route one of four digital inputs to one output using a 2-bit selection value. Which block fits?', ['A 4-to-1 multiplexer', 'A 1-bit inverter', 'A rectifier', 'A current transformer'], 'Two select bits encode four choices. A multiplexer connects the selected input to the output.'),
  xq('logic-latch', 'logic', 2, 'Timing', 'A transparent-high D latch has ENABLE = 1. What normally happens to Q?', ['Q follows D, subject to propagation delay', 'Q can change only on a rising edge', 'Q always becomes 0', 'Q is disconnected from all logic'], 'A latch is level-sensitive: it is transparent during its enable level. A flip-flop is edge-triggered.'),
  xq('logic-metastable', 'logic', 3, 'Clock domains', 'An asynchronous input is sampled near a clock edge. What does a suitable multi-stage synchronizer mainly do?', ['Reduce the probability that metastability propagates into downstream logic', 'Guarantee that metastability can never occur', 'Convert the input to mains voltage', 'Store the entire input waveform'], 'The extra resolution time reduces failure probability; it is not an absolute elimination of metastability. Multi-bit data requires a suitable crossing protocol.'),

  xq('math-milli', 'maths', 1, 'Units in practice', 'A sensor consumes 250 mA. What is that current in amperes?', ['0.25 A', '250 A', '2.5 A', '0.0025 A'], 'Milli means one thousandth. 250 mA = 250 / 1000 A = 0.25 A.'),
  xq('math-micro', 'maths', 1, 'Units in practice', 'A capacitor is 4700 nF. Which equivalent value is correct?', ['4.7 µF', '4700 µF', '0.0047 µF', '47 mF'], '1000 nF = 1 µF, so 4700 nF = 4.7 µF.'),
  xq('math-rearrange', 'maths', 1, 'Rearranging formulas', 'You know the desired power P and the supply voltage V. Starting with P = VI, how do you find current?', ['I = P / V', 'I = P × V', 'I = V / P', 'I = P − V'], 'Divide both sides of P = VI by V. Units also check: watts / volts = amperes.'),
  xq('math-tolerance', 'maths', 2, 'Component tolerance', 'A 100 Ω resistor has ±5% tolerance. Which range is within its stated tolerance?', ['95–105 Ω', '5–100 Ω', '99.95–100.05 Ω', '100–150 Ω'], '5% of 100 Ω is 5 Ω, so the nominal tolerance range is 100 ± 5 Ω.'),
  xq('math-rms', 'maths', 2, 'Waveforms', 'A pure sine wave is 10 V peak. What is its approximate RMS voltage?', ['7.07 V', '20 V', '10 V', '5 V'], 'For a sine wave, Vrms = Vpeak / √2. This relation does not apply to every waveform shape.'),
  xq('math-period', 'maths', 1, 'Timing', 'A repeating event happens 1000 times per second. What is its period?', ['1 ms', '1 s', '1000 s', '100 ms'], 'Period T = 1/f = 1/1000 second = 1 ms.'),
  xq('math-db', 'maths', 3, 'Decibels', 'A voltage amplifier doubles signal amplitude, with equal input/output reference impedance. What is its approximate voltage gain in dB?', ['6.02 dB', '2 dB', '3.01 dB', '20 dB'], 'Voltage gain in dB under the stated condition is 20 log10(Vout/Vin). For a factor of 2 this is about 6.02 dB.'),
  xq('math-average', 'maths', 1, 'Measurement', 'You record sensor readings 10, 12 and 14. What is their arithmetic mean?', ['12', '36', '14', '2'], 'Add the readings and divide by their count: (10 + 12 + 14)/3 = 12.'),
  xq('math-slope', 'maths', 2, 'Calibration', 'A sensor output rises from 1 V to 3 V while temperature rises from 20 °C to 40 °C. Assuming a linear response, what is its slope?', ['0.1 V/°C', '10 V/°C', '2 V/°C', '20 V/°C'], 'Slope = change in output / change in input = (3 − 1)/(40 − 20) = 0.1 V/°C.'),
  xq('math-error', 'maths', 2, 'Measurement error', 'A meter reads 10.2 V when the reference is 10.0 V. What is the signed percentage error relative to the reference?', ['+2%', '+0.2%', '−2%', '+20%'], 'Percentage error = (measured − reference)/reference × 100 = 0.2/10 × 100 = +2%.'),

  xq('sig-serial', 'signals', 1, 'UART wiring', 'Two compatible low-voltage UART boards share signal ground. How do you connect their data lines for two-way communication?', ['TX of each board to RX of the other', 'TX to TX and RX to RX', 'Both TX pins directly to ground', 'Only connect RX to RX'], 'One device’s transmitter drives the other device’s receiver. Check signal levels and interface standards too.'),
  xq('sig-baud', 'signals', 1, 'UART timing', 'One UART is configured for 9600 baud and the other for 115200 baud. What should you check first when receiving garbled characters?', ['Make baud rate and frame format agree', 'Double the wire length', 'Set both pins as outputs', 'Remove their signal reference'], 'Both ends must agree on timing and frame settings, within their supported tolerances.'),
  xq('sig-i2c', 'signals', 1, 'I²C bus', 'A standard I²C bus uses open-drain/open-collector SDA and SCL. What brings the released lines HIGH?', ['Suitable pull-up resistors', 'Every device driving HIGH strongly', 'A resistor in series with each supply only', 'Reversing the clock and data wires'], 'Devices pull a line low or release it; pull-ups establish the high level. Values depend on bus capacitance, speed and device limits.'),
  xq('sig-spi', 'signals', 1, 'SPI selection', 'Several peripherals share an SPI bus. What normally tells a particular peripheral that a transfer is for it?', ['Its chip-select signal', 'A unique UART baud rate', 'A mains frequency change', 'Its LED colour'], 'A common SPI arrangement shares clock/data but uses individual chip-select signals. Exact behaviour is peripheral-specific.'),
  xq('sig-antialias', 'signals', 2, 'Sampling', 'Why put an anti-alias low-pass filter before an ADC?', ['Reduce higher-frequency content that would fold into the sampled band', 'Restore information after it has already aliased', 'Guarantee a higher bit depth', 'Make every signal DC'], 'Content above the usable sampling band can appear at false lower frequencies. The filter must act before sampling.'),
  xq('sig-alias', 'signals', 2, 'Sampling', 'A 900 Hz sine is sampled at exactly 1000 samples/s with no anti-alias filter. What lower frequency does it alias to?', ['100 Hz', '9000 Hz', '1900 Hz', '500 Hz'], '900 Hz folds around the 500 Hz Nyquist frequency to 100 Hz: |900 − 1000| = 100. Phase may differ.'),
  xq('sig-sampling', 'signals', 1, 'Sampling', 'To reconstruct an ideally band-limited signal containing frequencies up to 3 kHz, which sampling rate is safely above twice the highest frequency?', ['10 ksample/s', '3 ksample/s', '4 ksample/s', '5 ksample/s'], 'The ideal condition requires more than 6 ksample/s here. Practical filters need a transition band, so designs usually allow extra margin.'),
  xq('sig-differential', 'signals', 2, 'Noise rejection', 'A receiver measures the voltage difference across a differential pair. Equal interference is added to both wires. What advantage does this provide?', ['Common-mode interference can be rejected within the receiver’s limits', 'The signal no longer needs any voltage limits', 'All noise is eliminated in every situation', 'The pair becomes a power supply'], 'The subtraction can cancel interference shared by both conductors. Balance, termination and common-mode ratings still matter.'),
  xq('sig-termination', 'signals', 2, 'Long cables', 'Fast digital edges on a long transmission line cause ringing at the receiver. What design issue should you investigate?', ['Impedance matching and suitable termination', 'Whether the cable has enough paint', 'Whether the bits are decimal', 'Only the average DC current'], 'Reflections occur at impedance changes. The relevant edge time and line delay can make even a modest clock rate a transmission-line problem.'),
  xq('sig-bandwidth', 'signals', 2, 'Audio filtering', 'An audio low-pass filter has its cutoff below the upper notes you want to preserve. What will likely happen?', ['Those higher-frequency components are attenuated', 'All bass disappears while treble increases', 'It generates missing harmonics exactly', 'It changes all notes to DC'], 'A low-pass filter attenuates frequencies above its passband. Choose its response around the actual signal bandwidth.'),
  xq('sig-8n1', 'signals', 2, 'Serial throughput', 'At 9600 baud, an 8N1 UART frame uses 1 start, 8 data and 1 stop bit. Ignoring gaps, what is the maximum payload rate?', ['960 bytes/s', '9600 bytes/s', '1200 bytes/s', '96 bytes/s'], 'Each payload byte consumes 10 line bits, so 9600/10 = 960 bytes/s.'),
  xq('sig-parity', 'signals', 2, 'Error detection', 'A simple parity bit detects which error pattern reliably within a protected frame?', ['An odd number of flipped bits', 'Every possible bit error pattern', 'Only errors in decimal digits', 'No single-bit errors'], 'An odd number of flips changes parity. An even number may leave parity unchanged; parity is detection, not a general correction scheme.'),

  py('range', 1, 'Read the output', 'What does this print?', 'total = 0\nfor n in range(4):\n    total += n\nprint(total)', ['6', '10', '4', '3'], 'range(4) yields 0, 1, 2, 3. Their sum is 6; the stop value is excluded.', '6'),
  py('input', 1, 'Find the bug', 'The user types 7. Which change makes the final line print the number 8?', 'count = input("Count: ")\nprint(count + 1)', ['Convert input with int(input("Count: "))', 'Replace + with a comma only', 'Remove the quotation marks from the prompt', 'Rename count to COUNT'], 'input() returns text. Convert suitable numeric input before doing arithmetic. Real applications should also handle invalid input.'),
  py('append', 1, 'Read the output', 'What does this print?', 'readings = [10, 20]\nreadings.append(30)\nprint(len(readings))', ['3', '30', '2', '60'], 'append adds one element to the existing list. len then returns 3.', '3'),
  py('division', 1, 'Operators', 'What does this print?', 'print(7 // 2)', ['3', '3.5', '4', '1'], '// performs floor division. 7 divided by 2 is 3.5, whose floor is 3.', '3'),
  py('remainder', 1, 'Practical arithmetic', 'A packet counter wraps every 8 packets. What does this print?', 'packet = 11\nprint(packet % 8)', ['3', '8', '1', '11'], 'Modulo returns the remainder. 11 = 1 × 8 + 3.', '3'),
  py('branch', 1, 'Control flow', 'A temperature reading is 35. What does the program print?', 'temperature = 35\nif temperature >= 30:\n    print("HOT")\nelse:\n    print("OK")', ['HOT', 'OK', 'HOT then OK', 'Nothing'], '35 >= 30 is true, so the if branch runs and the else branch does not.', 'HOT'),
  py('slice', 2, 'Read the output', 'What does this print?', 'samples = [4, 8, 12, 16]\nprint(samples[1:3])', ['[8, 12]', '[4, 8, 12]', '[8, 12, 16]', '[12]'], 'Slicing includes the start index (1) and excludes the stop index (3).', '[8, 12]'),
  py('return', 2, 'Functions', 'What does this print?', 'def power(v, i):\n    return v * i\n\nprint(power(12, 2))', ['24', '14', '6', 'None'], 'The function returns the product. The outer print displays that returned value.', '24'),
  py('alias', 2, 'Find the bug', 'Changing b also changes a. Which initialization makes a separate shallow copy of the list?', 'a = [1, 2]\nb = a\nb.append(3)', ['b = a.copy()', 'b = a again', 'b = None', 'b = len(a)'], 'Assignment shares the same list object. a.copy() makes a new list; nested objects still require care because the copy is shallow.'),
  py('loop-fix', 2, 'Find the bug', 'This counter is meant to print 0, 1, 2 then stop. What is missing?', 'n = 0\nwhile n < 3:\n    print(n)', ['Increment n inside the loop', 'Convert n to a string', 'Change while to an import', 'Add another print before the loop'], 'Without updating n, the condition remains true forever. Add n += 1 inside the loop.'),
  py('dictionary', 2, 'Sensor data', 'What does this print?', 'sensor = {"voltage": 12, "current": 2}\nprint(sensor["voltage"] * sensor["current"])', ['24', '14', '"voltagecurrent"', '2'], 'Dictionary keys retrieve the values 12 and 2; their product is 24.', '24'),
  py('default-list', 3, 'Find the bug', 'Calls unexpectedly share old readings. What is a standard fix for this function’s default argument?', 'def record(value, readings=[]):\n    readings.append(value)\n    return readings', ['Default to None and create a new list inside when needed', 'Move append before def', 'Use the same list with a different name', 'Replace return with input'], 'Default arguments are evaluated when the function is defined. A mutable list is reused across calls that omit that argument.'),

  basic('loop', 1, 'Read the program', 'Which numbers are printed, in order?', '10 FOR I=1 TO 3\n20 PRINT I\n30 NEXT I', ['1, 2, 3', '0, 1, 2', '1, 2', '3, 2, 1'], 'MSX BASIC FOR includes the end value when the step reaches it. The default STEP is 1.'),
  basic('string', 1, 'Variables', 'Which variable is a string variable in MSX BASIC 1?', '10 NAME$="RADIX"\n20 PRINT NAME$', ['NAME$', 'NAME%', 'NAME!', 'NAME#'], 'The $ suffix identifies a string. %, ! and # are numeric type suffixes.'),
  basic('jump', 1, 'Program flow', 'Which word is printed?', '10 GOTO 30\n20 PRINT "A"\n30 PRINT "B"\n40 END', ['B', 'A', 'A then B', 'Neither'], 'GOTO 30 skips line 20. Line 30 prints B, and END stops the program.'),
  basic('gosub', 1, 'Subroutines', 'Which words are printed, in order?', '10 GOSUB 100\n20 PRINT "DONE"\n30 END\n100 PRINT "HELLO"\n110 RETURN', ['HELLO then DONE', 'DONE then HELLO', 'Only HELLO', 'HELLO forever'], 'GOSUB saves a return point. RETURN resumes at line 20. END prevents normal execution from falling into the subroutine.'),
  basic('data', 1, 'Stored data', 'Which value is printed?', '10 DATA 12,24,48\n20 READ A,B\n30 PRINT B', ['24', '12', '48', '2'], 'READ consumes DATA values in order. A receives 12 and B receives 24.'),
  basic('screen', 1, 'MSX1 graphics', 'Which command selects the MSX1 256 × 192 graphics mode used by SCREEN 2 programs?', '10 REM CHOOSE A SCREEN MODE', ['SCREEN 2', 'SCREEN 5', 'SCREEN 8', 'SCREEN 12'], 'SCREEN 2 is an MSX1 graphics mode. SCREEN 5 and 8 require MSX2; SCREEN 12 requires MSX2+ capabilities.'),
  basic('line-order', 1, 'Line numbers', 'You enter these lines in the shown order. Which words are printed when you RUN?', '20 PRINT "SECOND"\n10 PRINT "FIRST"\n30 END', ['FIRST then SECOND', 'SECOND then FIRST', 'Only SECOND', 'Nothing until lines are re-entered'], 'Numbered program lines execute in increasing line-number order, unless a control-flow statement redirects execution.'),
  basic('step', 2, 'Loops', 'Which values are printed?', '10 FOR I=6 TO 2 STEP -2\n20 PRINT I\n30 NEXT I', ['6, 4, 2', '6, 5, 4, 3, 2', '2, 4, 6', '6, 4'], 'A negative STEP counts down. The end value 2 is included here.'),
  basic('if', 1, 'Decisions', 'Which word is printed?', '10 T=35\n20 IF T>=30 THEN PRINT "HOT" ELSE PRINT "OK"\n30 END', ['HOT', 'OK', 'Both', 'Neither'], 'The condition is true. MSX BASIC executes the THEN branch.'),
  basic('dim', 2, 'Arrays', 'With this declaration, which indexes are available for A?', '10 DIM A(3)', ['0, 1, 2, 3', '1, 2, 3 only', '0, 1, 2 only', '3 only'], 'In MSX BASIC, the DIM value is the upper bound; indexing starts at 0. A(3) provides four elements.'),
  basic('restore', 2, 'DATA and READ', 'Which values are printed?', '10 DATA 5,9\n20 READ A\n30 RESTORE\n40 READ B\n50 PRINT A;B', ['5 and 5', '5 and 9', '9 and 5', '9 and 9'], 'RESTORE resets the DATA read position to the start, so B receives 5 again.'),
  basic('return-bug', 2, 'Find the bug', 'Why can this program report RETURN without GOSUB after printing DONE?', '10 GOSUB 100\n20 PRINT "DONE"\n100 PRINT "SUB"\n110 RETURN', ['It falls into the subroutine again; add END after the main program', 'GOSUB never saves a return point', 'PRINT cannot use string literals', 'Line numbers must always increase by 1'], 'After the first RETURN, execution resumes at line 20 then continues into line 100. The second RETURN has no matching GOSUB. End or redirect the main path.'),

function makeMathQuestion(difficulty, rng = Math.random) {
  const pick = values => values[Math.floor(rng() * values.length)];
  const level = Number(difficulty), kind = pick(['period', 'tolerance', 'conversion', 'scaling', ...(level > 1 ? ['rms'] : [])]);
  let value, prompt, unit, explanation, visual;
  if (kind === 'period') {
    const frequency = pick([50, 100, 250, 500, 1000, 2000]);
    value = 1000 / frequency; unit = 'ms'; prompt = `A signal repeats at ${frequency} Hz. What is its period in milliseconds?`;
    explanation = `T = 1/f seconds = 1000/${frequency} = ${value} ms.`; visual = [['Frequency', `${frequency} Hz`]];
  } else if (kind === 'tolerance') {
    const nominal = pick([100, 220, 470, 1000]), percent = pick([1, 5, 10]);
    value = nominal * (1 + percent / 100); unit = 'Ω'; prompt = `A ${nominal} Ω resistor has ±${percent}% tolerance. What is the upper limit?`;
    explanation = `Upper limit = ${nominal} × (1 + ${percent}/100) = ${value} Ω.`; visual = [['Nominal', `${nominal} Ω`], ['Tolerance', `±${percent}%`]];
  } else if (kind === 'conversion') {
    const ma = pick([5, 25, 80, 125, 250, 750, 1500]);
    value = ma / 1000; unit = 'A'; prompt = `Convert ${ma} mA to amperes.`;
    explanation = `Milli means 10⁻³: ${ma}/1000 = ${value} A.`; visual = [['Current', `${ma} mA`]];
  } else if (kind === 'scaling') {
    const count = pick([100, 250, 400, 600, 750, 900]), full = pick([50, 100, 200]);
    value = count / 1000 * full; unit = '°C'; prompt = `A linear temperature sensor maps 0–${full} °C to 0–1000 counts. What temperature is ${count} counts?`;
    explanation = `${count}/1000 × ${full} = ${value} °C, assuming the stated ideal linear calibration.`; visual = [['Reading', `${count} counts`], ['Full scale', `${full} °C`]];
  } else {
    const peak = pick([2, 5, 10, 12, 20]); value = peak / Math.SQRT2; unit = 'V'; prompt = `A pure sine wave is ${peak} V peak. What is its RMS voltage?`;
    explanation = `For a sine wave, Vrms = ${peak}/√2 ≈ ${Number(value.toFixed(3))} V.`; visual = [['Sine-wave peak', `${peak} V`]];
  }
  return { id: `maths-${kind}-${prompt}`, category: 'maths', level, type: 'number', topic: 'Engineering calculation', prompt, value, unit, visual, answer: String(Number(value.toFixed(3))), explanation, tolerance: Math.max(value * 0.02, 0.002), hint: kind === 'period' ? 'T = 1/f; multiply seconds by 1000 to get ms.' : kind === 'tolerance' ? 'Upper limit = nominal × (1 + tolerance/100).' : kind === 'conversion' ? 'Divide milliamps by 1000.' : kind === 'scaling' ? 'Find the fraction of full-scale counts, then apply it to the temperature range.' : 'Divide the peak voltage by √2.', inputLabel: `Your answer in ${unit}`, inputHelp: 'Enter the number in the shown unit. Rounding within 2% is accepted.' };
}

function generalSegregation(a, b) {
  const group = c => ['1.1', '1.2', '1.5'].includes(c) ? GENERAL_CLASSES[0] : ['1.3', '1.6'].includes(c) ? GENERAL_CLASSES[1] : c;
  const i = GENERAL_CLASSES.indexOf(group(a)), j = GENERAL_CLASSES.indexOf(group(b));
  if (i < 0 || j < 0) throw new RangeError('Unknown IMDG class or division.');

const COMPATIBILITY_GROUPS = 'A B C D E F G H J K L N S'.split(' ');
// Entries are the X cells; the suffix is the associated table note.
const COMPATIBILITY_ROWS = {
  A: { A: 0 }, B: { B: 0, S: 0 },
  C: { C: 0, D: 6, E: 6, G: 1, N: 4, S: 0 },
  D: { C: 6, D: 0, E: 6, G: 1, N: 4, S: 0 },
  E: { C: 6, D: 6, E: 0, G: 1, N: 4, S: 0 },
  F: { F: 0, S: 0 }, G: { C: 1, D: 1, E: 1, G: 0, S: 0 },
  H: { H: 0, S: 0 }, J: { J: 0, S: 0 }, K: { K: 0, S: 0 },
  L: { L: 2 }, N: { C: 4, D: 4, E: 4, N: 3, S: 5 },
  S: { B: 0, C: 0, D: 0, E: 0, F: 0, G: 0, H: 0, J: 0, K: 0, N: 5, S: 0 },
};
function class1Compatibility(a, b) {
  if (!COMPATIBILITY_GROUPS.includes(a) || !COMPATIBILITY_GROUPS.includes(b)) return { status: 'unknown', note: null };
  const note = COMPATIBILITY_ROWS[a][b];
  return note === undefined ? { status: 'forbidden', note: null } : { status: note ? 'conditional' : 'permitted', note };
}

function shuffle(items, rng = Math.random) {
  const copy = [...items];
  for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; }
  return copy;
}
const choose = (items, rng) => items[Math.floor(rng() * items.length)];
const integer = (min, max, rng) => min + Math.floor(rng() * (max - min + 1));
const formatNumber = (n) => Number(n.toFixed(3)).toLocaleString('en-US', { maximumFractionDigits: 3, useGrouping: false });

function toBase(value, base) {
  if (!Number.isSafeInteger(value) || !Number.isInteger(base) || base < 2 || base > 12) throw new RangeError('Use an integer and a base from 2 to 12.');
  return value.toString(base).toUpperCase();
}

function parseBase(raw, base) {
  if (!Number.isInteger(base) || base < 2 || base > 12) return null;
  let value = String(raw).trim().toUpperCase().replace(/\s+/g, '');
  if (base === 2) value = value.replace(/^0B/, '');
  if (!/^-?[0-9AB]+$/.test(value)) return null;
  const negative = value.startsWith('-');
  const body = negative ? value.slice(1) : value;
  let result = 0;
  for (const digit of body) { const place = DIGITS.indexOf(digit); if (place >= base) return null; result = result * base + place; if (!Number.isSafeInteger(result)) return null; }
  return negative ? -result : result;
}

function placeValue(n, base) {
  return [...toBase(n, base)].map((digit, i, arr) => `${DIGITS.indexOf(digit)} × ${base}^${arr.length - i - 1}`).join(' + ');
}

function makeBaseQuestion(settings, rng = Math.random) {
  const base = settings.base === 'any' ? integer(2, 12, rng) : Number(settings.base);
  const level = Number(settings.difficulty);
  const mode = settings.baseMode === 'mixed' ? choose(['count', 'convert', 'arithmetic', 'convert'], rng) : settings.baseMode;
  const max = [0, 30, 255, 4095][level];
  let prompt, value, answerBase = base, explanation, hint, visual, topic;
  if (mode === 'count') {
    const step = level === 3 ? choose([1, 2, 3, -1], rng) : 1;
    const start = integer(step < 0 ? 4 : 0, max, rng);
    const sequence = [start, start + step, start + 2 * step];
    value = start + 3 * step;
    prompt = `Keep counting in base ${base}. What comes next?`;
    visual = `${sequence.map(n => toBase(n, base)).join('  ·  ')}  ·  ?`;
    topic = 'Counting';
    explanation = `The step is ${step} in decimal. The next decimal value is ${value}, written ${toBase(value, base)} in base ${base}. Each digit must be smaller than ${base}.`;
    hint = step === 1 ? `After the largest digit (${DIGITS[base - 1]}), carry 1 into the next column.` : `Find the step in decimal, then write the next value in base ${base}.`;
  } else if (mode === 'convert') {
    const from = level === 1 ? choose([base, 10], rng) : choose([base, 10, integer(2, 12, rng)], rng);
    const to = from === base ? (base === 10 ? choose([2, 3, 8, 12], rng) : 10) : base;
    value = integer(1, max, rng);
    answerBase = to;
    prompt = `Convert this base-${from} number to base ${to}.`;
    visual = `${toBase(value, from)}${subscript(from)}  =  ?${subscript(to)}`;
    topic = 'Conversion';
    explanation = `${toBase(value, from)} in base ${from} = ${placeValue(value, from)} = ${value} in decimal. ${value} in base ${to} is ${toBase(value, to)}.`;
    hint = `Use powers of ${from} to reach decimal. Then repeatedly divide by ${to} and read the remainders backward.`;
  } else {
    const subtract = level > 1 && rng() < 0.5;
    let a = integer(1, Math.max(5, Math.floor(max / 3)), rng), b = integer(1, Math.max(5, Math.floor(max / 4)), rng);
    if (subtract && a < b) [a, b] = [b, a];
    value = subtract ? a - b : a + b;
    prompt = `${subtract ? 'Subtract' : 'Add'} these numbers in base ${base}.`;
    visual = `${toBase(a, base)}${subscript(base)}  ${subtract ? '−' : '+'}  ${toBase(b, base)}${subscript(base)}  =  ?`;
    topic = 'Arithmetic';
    explanation = `In decimal: ${a} ${subtract ? '−' : '+'} ${b} = ${value}. In base ${base}, the result is ${toBase(value, base)}. Carry or borrow using ${base}, rather than 10.`;
    hint = `Each column has a place value that is a power of ${base}. You can convert to decimal as a cross-check.`;
  }
  return { id: `bases-${mode}-${base}-${visual}`, category: 'bases', level, topic, prompt, visual, type: 'base', answer: toBase(value, answerBase), value, answerBase, explanation, hint, inputLabel: `Your answer in base ${answerBase}`, inputHelp: `Digits: ${DIGITS.slice(0, answerBase).split('').join(' ')}${answerBase > 10 ? ' · A = 10' + (answerBase > 11 ? ', B = 11' : '') : ''}` };
}

const subscript = n => String(n).split('').map(x => '₀₁₂₃₄₅₆₇₈₉'[Number(x)]).join('');

function prepareChoice(question, rng = Math.random) {
  const correct = question.options[0];
  const options = shuffle(question.options, rng);
  return { ...question, type: 'choice', options, correctIndex: options.indexOf(correct), answer: correct, hint: question.hint || `Think about the ${question.topic.toLowerCase()} decision in this specific situation${question.jurisdiction ? ` and the ${question.jurisdiction} label` : ''}.` };
}

function checkAnswer(question, input) {
  if (question.type === 'choice') return Number.isInteger(input) && input === question.correctIndex;
  if (question.type === 'base') return parseBase(input, question.answerBase) === question.value;
  const raw = String(input).trim().replace(/,/g, '.');
  if (!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(raw)) return false;
  const value = Number(raw);
  return Number.isFinite(value) && Math.abs(value - question.value) <= question.tolerance;
}

function eligibleQuestions(category, settings) {
  return QUESTIONS.filter(q => q.category === category && q.level <= Number(settings.difficulty)
    && (category !== 'fire' || !settings.fireScope || settings.fireScope === 'all' || (settings.fireScope === 'general' ? q.jurisdiction === 'General practice' : q.jurisdiction.startsWith(settings.fireScope === 'us' ? 'US' : 'UK')))
    && (category !== 'cargo' || !settings.cargoFocus || settings.cargoFocus === 'all' || (settings.cargoFocus === 'segregation' ? q.focus !== 'labels' : q.focus === settings.cargoFocus)));
}

function makeDeck(settings, count = 10, rng = Math.random, previous = new Set()) {
  const categories = settings.category === 'mixed' ? shuffle(Object.keys(CATEGORIES), rng) : [settings.category];
  const pools = Object.fromEntries(categories.map(c => [c, shuffle(eligibleQuestions(c, settings), rng)]));
  const cursor = Object.fromEntries(categories.map(c => [c, 0]));
  const deck = [];
  for (let i = 0; i < count; i++) {
    const category = settings.category === 'mixed' ? categories[i % categories.length] : categories[0];
    let question;
    for (let tries = 0; tries < 30; tries++) {
      if (category === 'bases') question = makeBaseQuestion(settings, rng);
      else if (['electronics', 'electrical'].includes(category) && rng() < 0.45) question = makeEngineeringQuestion(category, settings.difficulty, rng);
      else if (category === 'maths' && rng() < 0.55) question = makeMathQuestion(settings.difficulty, rng);
      else if (category === 'cargo' && settings.cargoFocus !== 'labels' && rng() < 0.55) question = prepareChoice(makeCargoQuestion(settings, rng), rng);
      else {
        const pool = pools[category];
        if (!pool.length) throw new Error('No questions match this selection.');
        question = prepareChoice(pool[cursor[category]++ % pool.length], rng);
      }
      if (!previous.has(question.id) || tries === 29) break;
    }
    previous.add(question.id);
    deck.push(question);
  }
  return settings.category === 'mixed' ? shuffle(deck, rng) : deck;
}

    await python.runPythonAsync(data.code, {globals});
    self.postMessage({type: 'result', output, error: errors});
  } catch (error) {
    self.postMessage({type: 'result', output, error: errors + error.message});
  } finally { globals.destroy(); }
};`;

class PythonRunner {
  worker = null;
  ready = false;
  pending = null;
  timer = null;
  async run(code, status) {
    if (this.pending) throw new Error('A program is already running.');
    return new Promise((resolve, reject) => {
      this.pending = {resolve, reject, code};
      if (!this.worker) {
        status('Loading Python… First load needs an internet connection.');
        const url = URL.createObjectURL(new Blob([pythonWorkerSource], {type: 'text/javascript'}));
        try { this.worker = new Worker(url, {type: 'module'}); }
        catch (error) { URL.revokeObjectURL(url); this.stop(error.message); return; }
        URL.revokeObjectURL(url);
        this.timer = setTimeout(() => this.stop('Python could not load. Check your connection, then run again.'), 45000);
        this.worker.onerror = () => this.stop('Python could not load. Check your connection, then run again.');
        this.worker.onmessage = ({data}) => {
          if (data.type === 'ready') { this.ready = true; this.send(status); }
          if (data.type === 'result' && this.pending) {
            clearTimeout(this.timer);
            const request = this.pending; this.pending = null;
            request.resolve(data);
          }
        };
      } else this.send(status);
    });
  }
  send(status) {
    if (!this.ready || !this.pending) return;
    clearTimeout(this.timer); status('Running Python…');
    this.timer = setTimeout(() => this.stop('Stopped after 5 seconds. Check for an infinite loop, then run again.'), 5000);
    this.worker.postMessage({code: this.pending.code});
  }
  stop(reason = 'Stopped. You can edit the code and run again.') {
    clearTimeout(this.timer); this.worker?.terminate(); this.worker = null; this.ready = false;
    const request = this.pending; this.pending = null;
    request?.reject(new Error(reason));
  }
}

let msxScriptPromise = null;
let msxHost = null;
let msxParking = null;
async function loadMSX() {
  if (window.WMSX?.room) return;
  if (!msxScriptPromise) msxScriptPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = WEBMSX_URL; script.crossOrigin = 'anonymous';
    script.integrity = 'sha384-kNkyHYQgtc2n314hU9laE0OhE+HSJ4vgEDskx8nWjJpq+STHkpMzmjhQWG0XnIlH';
    const timer = setTimeout(() => { script.remove(); msxScriptPromise = null; reject(new Error('MSX could not load. Check your connection, then run again.')); }, 30000);
    script.onload = () => { clearTimeout(timer); resolve(); };
    script.onerror = () => { clearTimeout(timer); script.remove(); msxScriptPromise = null; reject(new Error('MSX could not load. Check your connection, then run again.')); };
    document.head.append(script);
  });
  await msxScriptPromise;
}
const waitBriefly = ms => new Promise(resolve => setTimeout(resolve, ms));
async function waitMSX(test, active, limit = 10000) {
  const start = performance.now();
  while (performance.now() - start < limit) {
    if (!active()) throw new Error('Stopped. You can edit the code and run again.');
    const value = test(); if (value) return value;
    await waitBriefly(100);
  }
  throw new Error('The MSX program did not finish. Check for an infinite loop or an INPUT waiting for keyboard input.');
}
function parkMSX() {
  window.WMSX?.room?.keyboard?.cancelTypeString();
  window.WMSX?.room?.machine?.powerOff();
  if (msxHost) {
    if (!msxParking) { msxParking = document.createElement('div'); msxParking.hidden = true; document.body.append(msxParking); }
    msxParking.append(msxHost);
  }
}

// Output checks compare displayed output, not source text. They are practice checks,

function createCodingLab(container, language, onExit) {
  const labChallenges = CHALLENGES[language], isPython = language === 'python';
  const htmlEscape = v => String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  container.innerHTML = `<section class="coding-lab">

    <div class="lab-output-panel"><span class="eyebrow">TARGET OUTPUT</span><pre id="target-output"></pre><span class="eyebrow">YOUR OUTPUT</span><pre id="code-output" aria-label="Program output">Run your code to see its output.</pre><p id="run-status" class="run-status" role="status" aria-live="polite"></p></div></div>
    ${!isPython ? '<div class="msx-display-panel" id="msx-display-panel" hidden><span class="eyebrow">LIVE MSX1</span><div id="msx-mount"></div><p class="input-help">Numbered BASIC program, executed by WebMSX. Screen capture checks the output after RUN.</p></div>' : ''}
    <details class="lab-help"><summary>Need a nudge?</summary><p id="code-hint"></p><button class="text-button" id="show-solution">Show a working solution</button><pre id="code-solution" hidden></pre></details>
    <p class="lab-foot">Quiz rounds work offline. The optional coding engines need an internet connection on first load. ${isPython ? 'Python: Pyodide 0.28.3.' : 'MSX1: WebMSX 6.0.8.'} Output checks ignore surrounding spaces and blank lines.</p>
  </section>`;
  const element = id => container.querySelector(`#${id}`);
  const editor = element('code-editor'), status = element('run-status');
  function setStatus(text, passed = false) { if (!active) return; status.textContent = text; status.classList.toggle('passed', passed); }
  function setBusy(value) {
    busy = value; if (!active) return;
    element('run-code').disabled = value; element('stop-code').disabled = !value;
    element('challenge-select').disabled = value; element('reset-code').disabled = value;
    editor.readOnly = value;
  }
  function loadChallenge() {
    const challenge = labChallenges[challengeIndex];
    element('challenge-title').textContent = challenge.title;
    element('challenge-prompt').textContent = challenge.prompt;
    element('target-output').textContent = challenge.expected;
    editor.value = drafts.get(challengeIndex) ?? challenge.starter;
    element('code-hint').textContent = challenge.hint;
    element('code-solution').hidden = true;
    element('code-solution').textContent = challenge.solution;
    element('code-output').textContent = 'Run your code to see its output.';
    setStatus('');
  }
  element('challenge-select').addEventListener('change', e => { drafts.set(challengeIndex, editor.value); challengeIndex = Number(e.target.value); loadChallenge(); });
  element('reset-code').addEventListener('click', () => { drafts.delete(challengeIndex); loadChallenge(); });
  element('show-solution').addEventListener('click', () => { element('code-solution').hidden = !element('code-solution').hidden; });
  editor.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); editor.setRangeText('    ', editor.selectionStart, editor.selectionEnd, 'end'); } });
  element('stop-code').addEventListener('click', () => { runToken++; pythonRunner.stop(); window.WMSX?.room?.keyboard?.cancelTypeString(); window.WMSX?.room?.machine?.powerOff(); setStatus('Stopped. You can edit the code and run again.'); setBusy(false); });
  element('lab-back').addEventListener('click', onExit);
  element('run-code').addEventListener('click', async () => {
    if (busy || !editor.value.trim()) { if (!editor.value.trim()) setStatus('Write a program first.'); return; }
    const token = ++runToken; const running = () => active && runToken === token;
    setBusy(true); element('code-output').textContent = '';
    try {
      let output, error = '';
      if (isPython) {
        const result = await pythonRunner.run(editor.value, setStatus);
        output = result.output; error = result.error;
      } else {
        if (!/^\s*\d+\s+\S/m.test(editor.value) || editor.value.split('\n').some(line => line.trim() && !/^\s*\d+\s+/.test(line))) throw new Error('Use numbered MSX BASIC program lines, for example: 10 PRINT "HELLO"');
        if (editor.value.length > 4000) throw new Error('Keep these practice programs under 4000 characters.');
        setStatus('Loading MSX1… First load needs an internet connection.');
        await loadMSX(); if (!running()) return;
        element('msx-display-panel').hidden = false;
        if (!msxHost) { msxHost = document.createElement('div'); msxHost.id = 'wmsx-screen'; }
        element('msx-mount').append(msxHost);
        if (!window.WMSX.room) {
          const width = element('msx-mount').clientWidth || 500;
          Object.assign(window.WMSX, {AUTO_START: false, ALLOW_URL_PARAMETERS: false, MACHINE: 'MSX1A', PRESETS: 'NODISK', FAST_BOOT: 1, AUTO_POWER_ON_DELAY: 0, SCREEN_ELEMENT_ID: 'wmsx-screen', SCREEN_DEFAULT_SCALE: Math.min(1, Math.max(0.25, width / (544 * 1.14))), SCREEN_DEFAULT_ASPECT: 1.14, SCREEN_FULLSCREEN_MODE: 0, SCREEN_FILTER_MODE: 0, SCREEN_CRT_SCANLINES: 0, SCREEN_CONTROL_BAR: 0, ENVIRONMENT: 83, JOYKEYS_MODE: -1, TOUCH_MODE: 0, Z80_CLOCK_MODE: 2});
          window.WMSX.start();
        } else { window.WMSX.room.keyboard.cancelTypeString(); window.WMSX.room.machine.powerOn(); }
        await waitMSX(() => {
          const text = window.WMSX.room?.machine.vdp.getScreenText() || '';
          return text.includes('MSX BASIC') && text.includes('Ok') && !text.includes('RDEND');
        }, running, 15000);
        setStatus('Running MSX BASIC 1…');
        const program = editor.value.replace(/\r/g, '').replace(/\n/g, '\r');
        // Clear entered source before RUN. Only text after the executed marker is graded.
        window.WMSX.room.keyboard.typeString(`NEW\r${program}\rSCREEN 0:WIDTH 40:CLS\rPRINT "RDSTART"\rRUN\rPRINT "RDEND"\r`);
        const screenText = await waitMSX(() => {
          const lines = window.WMSX.room.machine.vdp.getScreenText().split('\n').map(line => line.trim());
          const begin = lines.lastIndexOf('RDSTART'), end = lines.lastIndexOf('RDEND');
          return begin >= 0 && end > begin ? lines.slice(begin + 1, end).join('\n') : null;
        }, running, 10000);
        const lines = screenText.split('\n').filter(line => line !== 'RUN' && line !== 'Ok' && !/^PRINT\s*"RDEND"$/i.test(line));
        output = lines.join('\n');
        if (/\b(?:error|without|undefined|overflow|out of|illegal|syntax)\b/i.test(output)) error = 'MSX BASIC reported an error. Check the live screen and your numbered lines.';
      }
      if (!running()) return;
      element('code-output').textContent = output + (error ? `${output ? '\n' : ''}${error}` : '') || '(No output)';
      const passed = !error && normalizeOutput(output) === normalizeOutput(labChallenges[challengeIndex].expected);
      setStatus(passed ? 'Output matches. Nicely done.' : error ? 'Fix the error and run again.' : 'Output differs from the target. Edit your code and try again.', passed);
    } catch (error) {
      if (running()) { setStatus(error.message); if (!isPython) { window.WMSX?.room?.keyboard?.cancelTypeString(); window.WMSX?.room?.machine?.powerOff(); } }
    } finally { if (running()) setBusy(false); }
  });
  loadChallenge(); container.querySelector('h1').focus({preventScroll: true});
  return () => { active = false; runToken++; pythonRunner.stop(); if (!isPython) parkMSX(); };
}

    if (revealed) return;
    hintUsed = true;
    const panel = main.querySelector('#hint-panel'); panel.hidden = !panel.hidden; panel.innerHTML = `<strong>A nudge</strong><p>${esc(q.hint)}</p>`;
    main.querySelector('#hint').textContent = panel.hidden ? 'Show hint' : 'Hide hint';
  });
  main.querySelector('#skip').addEventListener('click', () => submit(true));
  main.querySelector('#end-round').addEventListener('click', finish);
  if (q.type !== 'choice') main.querySelector('#answer-input').focus({ preventScroll: true }); else focusHeading();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

function pick(index) {
  if (revealed) return;
  selected = index;
  main.querySelectorAll('.answer-choice').forEach(label => { const active = Number(label.dataset.choice) === index; label.classList.toggle('selected', active); label.querySelector('input').checked = active; });
  main.querySelector('#input-error').textContent = '';
}

function submit(skip = false) {
  if (revealed) return;
  const q = session.deck[session.index];
  const input = q.type === 'choice' ? selected : main.querySelector('#answer-input').value.trim();
  if (!skip && (input === null || input === '')) {
    main.querySelector('#input-error').textContent = q.type === 'choice' ? 'Choose an answer first.' : 'Enter an answer first.';
    main.querySelector('#answer-input')?.focus(); return;
  }
  revealed = true;
  const correct = !skip && checkAnswer(q, input);
  session.streak = correct ? session.streak + 1 : 0;
  session.bestStreak = Math.max(session.bestStreak, session.streak);
  const points = correct ? (hintUsed ? 75 : 100) + Math.min((session.streak - 1) * 10, 50) : 0;
  session.score += points;
  session.answers.push({ q, correct, skipped: skip, input: skip ? null : input, hintUsed, points });
  main.querySelector('#score').textContent = session.score;
  main.querySelectorAll('#answer-form input').forEach(el => el.disabled = true);
  main.querySelectorAll('#answer-form button').forEach(el => el.disabled = true);
  if (q.type === 'choice') {
    main.querySelectorAll('.answer-choice').forEach(label => {
      const index = Number(label.dataset.choice);
      if (index === q.correctIndex) { label.classList.add('correct'); label.querySelector('.choice-status').textContent = '✓'; }
      else if (index === input && !skip) { label.classList.add('incorrect'); label.querySelector('.choice-status').textContent = '×'; }
    });
  } else main.querySelector('.answer-input-wrap').classList.add(correct ? 'correct' : 'incorrect');
  const feedback = main.querySelector('#feedback');
  feedback.hidden = false; feedback.className = `feedback ${correct ? 'feedback-correct' : 'feedback-incorrect'}`;
  const final = !session.endless && session.index === session.deck.length - 1;
  feedback.innerHTML = `<div class="feedback-heading"><strong>${correct ? 'That’s right.' : skip ? 'Let’s work it out.' : 'Not quite.'}</strong><span>${correct ? `+${points} pts` : 'Keep going'}</span></div>${!correct ? `<p class="correct-answer">Answer: <strong>${esc(q.answer)}${q.unit ? ` ${esc(q.unit)}` : q.type === 'base' ? ` (base ${q.answerBase})` : ''}</strong></p>` : ''}<p class="explanation">${esc(q.explanation)}</p>${sourceLink(q)}<button class="primary-button next-button" id="next">${final ? 'See results' : 'Next question'} <kbd>↵</kbd></button>`;
  main.querySelector('#next').addEventListener('click', next);
  main.querySelector('#next').focus({ preventScroll: true });
  feedback.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
}

function sourceLink(q) {
  const source = SOURCES[q.source];
  return source ? `<a class="source-link" href="${esc(source.url + (q.page ? `#page=${q.page}` : ''))}" target="_blank" rel="noopener noreferrer">${esc(source.name)}${q.reference ? ` · ${esc(q.reference)}` : ''} <span class="sr-only">(opens in a new tab)</span></a>` : '';
}

function next() {
  if (!revealed) return;
  session.index++;
  if (session.index === session.deck.length) {
    if (session.endless) session.deck.push(...makeDeck(session.settings, 10, Math.random, session.seen));
    else { finish(); return; }
  }
  renderQuestion();
}

function finish() {
  if (!session.answers.length) { session = null; home(); focusHeading(); return; }
  screen = 'results'; setAccent(session.settings.category);
  const answers = session.answers, correct = answers.filter(a => a.correct).length, missed = answers.filter(a => !a.correct);
  const accuracy = Math.round(correct / answers.length * 100);
  const verdict = accuracy === 100 ? 'A clean sweep.' : accuracy >= 80 ? 'You know your way around.' : accuracy >= 50 ? 'Good work. Keep building.' : 'Every round teaches you something.';
  main.innerHTML = `<section class="results">
    <p class="eyebrow">${session.review ? 'REVIEW COMPLETE' : 'ROUND COMPLETE'}</p><h1 tabindex="-1">${verdict}</h1>
    <div class="result-score"><strong>${accuracy}<span>%</span></strong><div>${correct} of ${answers.length} correct<small>${session.settings.category === 'mixed' ? 'Mixed practice' : CATEGORIES[session.settings.category].name}</small></div></div>
    <div class="result-stats"><div><span>Points earned</span><strong>${session.score.toLocaleString()}</strong></div><div><span>Best streak</span><strong>${session.bestStreak}<small> in a row</small></strong></div><div><span>To revisit</span><strong>${missed.length}<small> question${missed.length === 1 ? '' : 's'}</small></strong></div></div>
    <div class="result-actions"><button class="primary-button" id="again">Play another round</button>${missed.length ? '<button class="secondary-button" id="review">Retry missed questions</button>' : ''}<button class="text-button" id="topics">Choose a topic</button></div>
    ${missed.length ? `<div class="review-area"><h2>Your takeaways <span>${missed.length}</span></h2>${missed.map((entry, i) => `<details class="review-item"><summary><span class="review-number">${String(i + 1).padStart(2, '0')}</span><span>${esc(entry.q.prompt)}</span><span class="review-plus" aria-hidden="true">+</span></summary><div class="review-content">${renderVisual(entry.q)}${entry.q.jurisdiction ? `<span class="jurisdiction">${esc(entry.q.jurisdiction)}</span>` : ''}<p class="muted">${entry.skipped ? 'Skipped' : `Your answer: ${esc(entry.q.type === 'choice' ? entry.q.options[entry.input] : entry.input)}`}</p><p>Answer: <strong>${esc(entry.q.answer)}${entry.q.unit ? ` ${esc(entry.q.unit)}` : entry.q.type === 'base' ? ` (base ${entry.q.answerBase})` : ''}</strong></p><p>${esc(entry.q.explanation)}</p>${sourceLink(entry.q)}</div></details>`).join('')}</div>` : '<div class="perfect-note"><span aria-hidden="true">✓</span><p>Everything clicked this round. Try another topic or raise the difficulty.</p></div>'}
  </section>`;
  main.querySelector('#again').addEventListener('click', () => start());
  main.querySelector('#review')?.addEventListener('click', () => start(missed.map(a => a.q)));
  main.querySelector('#topics').addEventListener('click', () => { session = null; home(); focusHeading(); });
  focusHeading(); window.scrollTo({ top: 0, behavior: 'instant' });
}

document.querySelector('.brand').addEventListener('click', e => { e.preventDefault(); session = null; home(); focusHeading(); });

document.addEventListener('keydown', e => {
  if (screen !== 'quiz' || e.altKey || e.ctrlKey || e.metaKey || e.repeat) return;
  const q = session.deck[session.index];
  if (!revealed && q.type === 'choice' && /^[1-4]$/.test(e.key)) { e.preventDefault(); pick(Number(e.key) - 1); }
  if (e.key === 'Enter' && e.target?.tagName !== 'BUTTON' && e.target?.tagName !== 'A') {
    e.preventDefault(); if (revealed) next(); else submit();
  }
});

home();

</script>
</body>
</html>
